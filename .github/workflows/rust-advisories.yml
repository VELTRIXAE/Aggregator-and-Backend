name: Rust advisories
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          command -v cargo-audit || cargo +1.99.1 install --locked cargo-audit --version 0.22.2
      - run: bash scripts/audit-rust.sh

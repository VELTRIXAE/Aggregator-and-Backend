name: Bug report
description: Something in the backend or client behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here. See SECURITY.md. Never include keys, recovery phrases or personal data."
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the revision, the request and the error code.
    validations:
      required: true
